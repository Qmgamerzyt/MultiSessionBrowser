name: Build APK

# Builds the CURRENT checked-out source tree (app/ + Gradle files at the repository root). Nothing is taken from a
# ZIP, a build/ folder or any other copy of the project. The "Verify source tree" step fails the run when the
# checkout is not the expected version (e.g. a stale v2.0.0 tree) or when a release tag does not match versionName.

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

jobs:
  build:
    name: Build debug + release APK (GeckoView, arm64-v8a + armeabi-v7a)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source tree (current version, matching tag, no stale copy)
        id: version
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts && test -f app/build.gradle.kts || { echo "::error::Gradle project not found at the repository root"; exit 1; }
          test -f app/src/main/java/app/multisession/browser/tabs/TabManager.kt || { echo "::error::Current source tree missing (TabManager.kt) - stale project copy?"; exit 1; }
          VN=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          VC=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          echo "Source versionName=$VN versionCode=$VC (commit ${GITHUB_SHA::8})"
          # The last public release was 2.0.0 (versionCode < 10). Anything at or below it is a stale checkout.
          if [ "$VC" -lt 10 ]; then echo "::error::versionCode $VC belongs to an old release, refusing to build/publish it"; exit 1; fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
            if [ "$TAG" != "$VN" ]; then echo "::error::Tag v$TAG does not match versionName $VN in app/build.gradle.kts"; exit 1; fi
          fi
          if grep -rq "android.webkit.WebView" app/src/main/java; then echo "::error::WebView reference found - engine must stay GeckoView"; exit 1; fi
          echo "version_name=$VN" >> "$GITHUB_OUTPUT"
          echo "version_code=$VC" >> "$GITHUB_OUTPUT"

      # REQUIRED - never optional: without this stable keystore every build would fall back to a
      # throwaway debug key (a fresh one per runner) and NO update could ever install over the
      # previous one: Android rejects differing signers with INSTALL_FAILED_UPDATE_INCOMPATIBLE.
      # Runs before ANY build so both debug and release APKs sign with the same key.
      # See BUGFIX_UPDATE_SIGNATURE.md for the evidence from all shipped releases.
      - name: Decode release keystore (required)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing - refusing to build APKs that could never update in place. Configure KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          {
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ---------------------------------------------------------------------------------------------------------
      # Android SDK setup - use pre-installed SDK on ubuntu-latest (no setup-android action).
      # The runner has Android SDK at /usr/local/lib/android/sdk with cmdline-tools pre-installed.
      # We just accept licenses and install required components via the existing sdkmanager.
      # ---------------------------------------------------------------------------------------------------------
      - name: Accept SDK licenses
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install SDK platforms + build-tools
        run: |
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.1" "build-tools;36.0.0" "platform-tools"

      - name: Print resolved toolchain (diagnostics)
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Build debug APKs
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: List built APKs (must carry the current version in their names)
        shell: bash
        run: |
          ls -l app/build/outputs/apk/debug/
          ls app/build/outputs/apk/debug/*.apk | grep -q "MultiSessionBrowser-${{ steps.version.outputs.version_name }}-" || { echo "::error::APK names do not carry versionName ${{ steps.version.outputs.version_name }}"; exit 1; }

      - name: Build release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          ls -l app/build/outputs/apk/release/

      # Guarantees the patched assets/omni.ja actually reached every APK. app/src/main/assets/omni.ja holds the
      # browser.cookies per-session patch (tools/patch_omni_cookies.py) and has to outrank the GeckoView AAR's stock
      # assets/omni.ja in AGP's asset merge. If that priority ever changed the build would still go green while
      # cookies quietly stopped working on device, so hash the file INSIDE each built APK instead of trusting it.
      - name: Verify packaged omni.ja carries the cookie patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_omni_cookies.py verify-source
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then echo "::error::no APKs found to verify"; exit 1; fi
          echo "checking ${#apks[@]} APK(s)"
          python3 tools/patch_omni_cookies.py verify-apk --apk "${apks[@]}"

      # Guarantees "updates install in place": every APK must carry the ONE pinned signing certificate.
      # A mismatch means a future update would be rejected by Android (signatures do not match), so the
      # run fails BEFORE anything is uploaded or attached. See BUGFIX_UPDATE_SIGNATURE.md.
      - name: Verify APK signer against the pinned certificate
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          WANT=$(tr -d ':\n ' < signing/pinned-signer.sha256 | tr 'A-F' 'a-f')
          if [ -z "$WANT" ]; then echo "::error::signing/pinned-signer.sha256 is missing or empty"; exit 1; fi
          shopt -s nullglob
          fail=0
          found=0
          for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            found=1
            GOT=$("$APKSIGNER" verify --print-certs "$apk" 2>/dev/null | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr 'A-F' 'a-f')
            if [ "$GOT" = "$WANT" ]; then
              echo "OK $(basename "$apk") -> $GOT"
            else
              echo "::error::Signer mismatch in $(basename "$apk"): got '${GOT:-no certificate}' want $WANT"
              fail=1
            fi
          done
          if [ "$found" -eq 0 ]; then echo "::error::no APKs found to verify"; exit 1; fi
          exit "$fail"

      # Artifact uploads: non-fatal + 1-day retention.
      # The account's Actions artifact storage quota verdict can be stale for days after artifacts are
      # deleted ("usage is recalculated every 6-12 hours"), and free accounts only get 500MB. A quota
      # rejection must NOT fail the job: release APKs are still delivered via GitHub Release assets
      # (a separate storage pool, see the "Attach APKs to GitHub Release" step), and retention-days: 1
      # keeps artifacts from ever filling the 500MB pool again. See BUGFIX_ARTIFACT_QUOTA.md.
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: MultiSessionBrowser-${{ steps.version.outputs.version_name }}-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 1

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: MultiSessionBrowser-${{ steps.version.outputs.version_name }}-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 1

      - name: Attach APKs to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: MultiSessionBrowser ${{ steps.version.outputs.version_name }}
          body: |
            versionName ${{ steps.version.outputs.version_name }} (versionCode ${{ steps.version.outputs.version_code }}), built from commit ${{ github.sha }}.
            One APK per ABI (arm64-v8a / armeabi-v7a); the file name contains the version.
          files: |
            app/build/outputs/apk/release/*.apk
