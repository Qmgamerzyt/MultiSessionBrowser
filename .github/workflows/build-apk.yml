name: Build APK

# Builds the CURRENT checked-out source tree (app/ + Gradle files at the repository root). Nothing is taken from a
# ZIP, a build/ folder or any other copy of the project. The "Verify source tree" step fails the run when the
# checkout is not the expected version (e.g. a stale v2.0.0 tree) or when a release tag does not match versionName.

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

jobs:
  build:
    name: Build debug + release APK (GeckoView, arm64-v8a + armeabi-v7a)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source tree (current version, matching tag, no stale copy)
        id: version
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts && test -f app/build.gradle.kts || { echo "::error::Gradle project not found at the repository root"; exit 1; }
          test -f app/src/main/java/app/multisession/browser/tabs/TabManager.kt || { echo "::error::Current source tree missing (TabManager.kt) - stale project copy?"; exit 1; }
          VN=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          VC=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          echo "Source versionName=$VN versionCode=$VC (commit ${GITHUB_SHA::8})"
          # The last public release was 2.0.0 (versionCode < 10). Anything at or below it is a stale checkout.
          if [ "$VC" -lt 10 ]; then echo "::error::versionCode $VC belongs to an old release, refusing to build/publish it"; exit 1; fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
            if [ "$TAG" != "$VN" ]; then echo "::error::Tag v$TAG does not match versionName $VN in app/build.gradle.kts"; exit 1; fi
          fi
          if grep -rq "android.webkit.WebView" app/src/main/java; then echo "::error::WebView reference found - engine must stay GeckoView"; exit 1; fi
          echo "version_name=$VN" >> "$GITHUB_OUTPUT"
          echo "version_code=$VC" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ---------------------------------------------------------------------------------------------------------
      # Android SDK setup - use pre-installed SDK on ubuntu-latest (no setup-android action).
      # The runner has Android SDK at /usr/local/lib/android/sdk with cmdline-tools pre-installed.
      # We just accept licenses and install required components via the existing sdkmanager.
      # ---------------------------------------------------------------------------------------------------------
      - name: Accept SDK licenses
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install SDK platforms + build-tools
        run: |
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.1" "build-tools;36.0.0" "platform-tools"

      - name: Print resolved toolchain (diagnostics)
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Build debug APKs
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: List built APKs (must carry the current version in their names)
        shell: bash
        run: |
          ls -l app/build/outputs/apk/debug/
          ls app/build/outputs/apk/debug/*.apk | grep -q "MultiSessionBrowser-${{ steps.version.outputs.version_name }}-" || { echo "::error::APK names do not carry versionName ${{ steps.version.outputs.version_name }}"; exit 1; }

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: MultiSessionBrowser-${{ steps.version.outputs.version_name }}-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Decode release keystore (only if secret is set)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          ls -l app/build/outputs/apk/release/

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: MultiSessionBrowser-${{ steps.version.outputs.version_name }}-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach APKs to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: MultiSessionBrowser ${{ steps.version.outputs.version_name }}
          body: |
            versionName ${{ steps.version.outputs.version_name }} (versionCode ${{ steps.version.outputs.version_code }}), built from commit ${{ github.sha }}.
            One APK per ABI (arm64-v8a / armeabi-v7a); the file name contains the version.
          files: |
            app/build/outputs/apk/release/*.apk
