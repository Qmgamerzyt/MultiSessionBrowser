name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Accept SDK licenses
        run: yes | (sdkmanager --licenses 2>/dev/null || "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true)

      - name: Install SDK platforms + build-tools
        run: sdkmanager "platforms;android-37.1" "build-tools;36.0.0" "platform-tools" 2>/dev/null || "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" "build-tools;36.0.0" "platform-tools"

      - name: Print resolved toolchain
        run: |
          java -version
          ls "/usr/local/lib/android/sdk/platforms"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build debug APKs
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: MultiSessionBrowser-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build release APKs
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: MultiSessionBrowser-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error