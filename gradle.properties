# The 230 MB GeckoView AAR is merged/dexed in-process: give Gradle enough heap.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.caching=true
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# GeckoView 155 AAR declares compileSdk 37.1; CI only has 37.0 (Baklava preview).
android.disableAarMetadataCheck=true
