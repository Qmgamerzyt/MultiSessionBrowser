# The 230 MB GeckoView AAR is merged/dexed in-process: give Gradle enough heap.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.caching=true
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Force Kotlin version to match KSP 2.3.12 (AGP 9.2.1 built-in Kotlin is too old).
kotlin.version=2.4.0
